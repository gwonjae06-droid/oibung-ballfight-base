name: Verify battle game
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all JavaScript modules
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Physics regression tests
        run: node --test tests/physics.test.cjs
