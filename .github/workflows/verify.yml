name: Verify battle game
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all JavaScript modules
        run: find js server -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Physics and UI structure regression tests
        run: node --test tests/*.test.cjs
