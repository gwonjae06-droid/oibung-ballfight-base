<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="오이붕 아레나 — 자유형 스킬 제작, 리메이크된 5인의 자동 배틀과 전투 이펙트.">
  <title>오이붕 아레나 | OIBUNG ARENA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main-container" id="container">
    <header class="page-header">
      <div class="brand-symbol" aria-hidden="true"><span>O</span><span>B</span></div>
      <div class="brand-copy">
        <span class="eyebrow">AUTO BATTLE</span>
        <h1>오이붕 <span>아레나</span></h1>
      </div>
    </header>

    <nav class="arena-category-nav" id="arena-category-nav" aria-label="게임 카테고리">
      <a href="#arena-stage" data-category="arena">경기</a>
      <a href="#match-setup" data-category="match" aria-current="location">대진 설정</a>
      <a href="#character-studio-dialog" data-category="creator">커스텀 캐릭터 만들기</a>
      <a href="#economy-section" data-category="economy">베팅 · 상점</a>
    </nav>

    <section class="battle-screen" aria-label="배틀 아레나">
      <div class="arena-heading">
        <span class="eyebrow">ARENA / 01</span>
        <strong id="title-text">1 VS 1</strong>
      </div>
      <div class="canvas-wrapper">
        <canvas id="arena" width="500" height="500" aria-label="캐릭터 자동 전투 화면"></canvas>
        <div class="arena-top-controls" role="group" aria-label="경기 속도 및 종료">
          <label class="arena-speed-control" for="bf-speed">
            <span>배속</span>
            <select id="bf-speed" aria-label="경기 배속">
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <button id="btn-stop" class="arena-stop-button" type="button"
                  onclick="stopMatch()" aria-label="경기 중지 및 무승부 처리"
                  title="진행 중인 경기를 승자 없이 종료하고 베팅금을 반환합니다" disabled>■ 중지</button>
        </div>
      </div>

      <div class="ui-container" id="ui-container" aria-label="캐릭터 체력">
        <div class="player-section" id="sec-p1">
          <div class="player-header">
            <div class="fighter-name"><span class="fighter-number">P1</span><span class="player-title" id="p1-name">P1</span></div>
            <span class="hp-text"><span id="p1-hp-text">250</span><span class="hp-max"> / <span id="p1-maxhp">250</span></span></span>
          </div>
          <div class="hp-bar-track"><div id="p1-hp-bar" class="hp-bar-fill"></div></div>
          <span id="p1-tag" class="mode-tag" style="display:none;"></span>
        </div>
        <div class="player-section" id="sec-p2">
          <div class="player-header">
            <div class="fighter-name"><span class="fighter-number">P2</span><span class="player-title" id="p2-name">P2</span></div>
            <span class="hp-text"><span id="p2-hp-text">250</span><span class="hp-max"> / <span id="p2-maxhp">250</span></span></span>
          </div>
          <div class="hp-bar-track"><div id="p2-hp-bar" class="hp-bar-fill"></div></div>
          <span id="p2-tag" class="mode-tag" style="display:none;"></span>
        </div>
        <div class="player-section" id="sec-p3" style="display:none;">
          <div class="player-header">
            <div class="fighter-name"><span class="fighter-number">P3</span><span class="player-title" id="p3-name">P3</span></div>
            <span class="hp-text"><span id="p3-hp-text">250</span><span class="hp-max"> / <span id="p3-maxhp">250</span></span></span>
          </div>
          <div class="hp-bar-track"><div id="p3-hp-bar" class="hp-bar-fill"></div></div>
          <span id="p3-tag" class="mode-tag" style="display:none;"></span>
        </div>
      </div>

      <nav class="control-panel" aria-label="경기 조작">
        <button id="btn-start" data-state="ready" type="button" onclick="togglePlay()">경기 시작</button>
        <button id="btn-reset" type="button" onclick="reRollMatch()">재매칭</button>
        <button id="btn-mode" type="button" onclick="toggleMode()" aria-label="경기 모드 전환">2인전</button>
      </nav>
    </section>

    <section class="economy-card" aria-label="베팅과 아이템 상점">
      <div class="economy-head"><h2 class="economy-title">우승 예측</h2><div class="coin-balance" id="coin-balance">1,000 G</div></div>
      <div class="bet-layout">
        <div class="bet-choice">
          <div class="field-label">우승 예상</div>
          <div class="bet-players" id="bet-players" aria-label="우승 예상 캐릭터"></div>
        </div>
        <div class="bet-stake">
          <label class="field-label" for="wager-input">베팅 금액</label>
          <div class="wager-wrap"><input id="wager-input" type="number" min="0" step="10" value="0" inputmode="numeric" aria-label="베팅 금액 (0이면 무료 관전)" oninput="renderEconomyUI()"><button class="mini-btn" id="btn-max-bet" type="button" onclick="setMaxBet()">MAX</button></div>
        </div>
      </div>
      <div class="odds-text" id="odds-text"></div>
      <div class="economy-message" id="economy-message" role="status" aria-live="polite"></div>
      <div class="economy-divider"></div>
      <h2 class="economy-title">아이템</h2>
      <div class="shop-grid">
        <article class="shop-item">
          <div class="shop-head"><h3>오버클럭</h3><span class="shop-price">650 G</span></div>
          <p>능력 쿨타임 단축</p><div class="shop-meta" id="inv-skillRush">보유 0</div>
          <button class="shop-btn" type="button" onclick="buyItem('skillRush')">구매</button>
          <div class="target-buttons" id="targets-skillRush" aria-label="오버클럭 적용 대상"></div>
        </article>
        <article class="shop-item">
          <div class="shop-head"><h3>생명 코어</h3><span class="shop-price">350 G</span></div>
          <p>최대 HP +75</p><div class="shop-meta" id="inv-vitality">보유 0</div>
          <button class="shop-btn" type="button" onclick="buyItem('vitality')">구매</button>
          <div class="target-buttons" id="targets-vitality" aria-label="생명 코어 적용 대상"></div>
        </article>
        <article class="shop-item">
          <div class="shop-head"><h3>돌진 부츠</h3><span class="shop-price">300 G</span></div>
          <p>이동속도 +35%</p><div class="shop-meta" id="inv-speed">보유 0</div>
          <button class="shop-btn" type="button" onclick="buyItem('speed')">구매</button>
          <div class="target-buttons" id="targets-speed" aria-label="돌진 부츠 적용 대상"></div>
        </article>
      </div>
      <div class="reserved-list" id="reserved-list"></div>
    </section>

  </main>

  <script src="js/core/state.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/features/economy.js"></script>
  <script src="js/characters/bae.js"></script>
  <script src="js/characters/oh.js"></script>
  <script src="js/characters/lee.js"></script>
  <script src="js/characters/park.js"></script>
  <script src="js/characters/choi.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/render.js"></script>
  <script src="js/features/vfx-audio.js"></script>
  <script src="js/features/character-remix.js"></script>
  <script src="js/main.js"></script>
  <script src="js/features/ability-atlas.js"></script>
  <script src="js/features/advanced-combat.js"></script>
  <script src="js/features/forge-expansion.js"></script>
  <script src="js/features/skill-forge.js"></script>
  <script src="js/features/skill-visuals.js"></script>
  <script src="js/features/natural-forge.js"></script>
  <script src="js/features/community-forge.js"></script>
  <script src="js/features/ui-categories.js"></script>
  <script src="js/features/studio-art.js"></script>
  <script src="js/features/battle-effects.js"></script>
</body>
</html>
